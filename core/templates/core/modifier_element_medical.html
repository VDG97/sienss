{% extends "core/base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="carte">
    <h1>{{ titre }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="champ">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<p style="color:#c0392b;font-size:0.85rem;">{{ error }}</p>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="bouton">Enregistrer</button>
        <a href="{% url 'informations_medicales' %}" class="discret" style="margin-left:1rem;">Annuler</a>
    </form>
</div>
{% endblock %}
